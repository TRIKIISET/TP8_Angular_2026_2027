<div class="d-flex justify-content-between align-items-center">
<div>
            <img [src]="park().photo" [alt]="park().photo">
            <span> Id: {{park().id}}</span>
            <strong> {{park().name}} </strong>
            <span class="badge bg-primary">
                {{park().nbLikes}} <i class="bi bi-hand-thumbs-up-fill"></i></span>
        </div>
        <div>
            <button class="btn btn-info" [routerLink]="['/parks', park().id]">
                <i class="bi bi-info-circle-fill"></i> Infos
            </button>
            <button class="btn btn-danger" (click)="onUpdateLikes(park())">
                <i class="bi bi-suit-heart-fill"></i> Likes
            </button>
            <button class="btn btn-secondary" (click)="onDeletePark(park().id)">
                <i class="bi bi-trash"></i> Supprimer
            </button>
        </div>

</div>
