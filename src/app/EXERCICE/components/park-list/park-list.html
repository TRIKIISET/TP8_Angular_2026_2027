<h1>Liste des parcs d'attraction</h1>
<ul class="list-group">
    @for(p of parks(); track p.id){
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <div>
            <img [src]="p.photo" [alt]="p.photo">
            <span> Id: {{p.id}}</span>
            <strong> {{p.name}} </strong>
            <span class="badge bg-primary">
                {{p.nbLikes}} <i class="bi bi-hand-thumbs-up-fill"></i></span>
        </div>
        <div>
            <button class="btn btn-info" [routerLink]="['/parks', p.id]">
                <i class="bi bi-info-circle-fill"></i> Infos
            </button>
            <button class="btn btn-danger" (click)="onUpdateLikes(p)">
                <i class="bi bi-suit-heart-fill"></i> Likes
            </button>
            <button class="btn btn-secondary" (click)="onDeletePark(p.id)">
                <i class="bi bi-trash"></i> Supprimer
            </button>
        </div>

    </li>
    }@empty {
    <li>Aucun parc</li>

    }

</ul>
